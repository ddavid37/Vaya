# Run secret leak scan on pull requests (feature branches). Skips conceptually on main.
name: Secret scan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secret leaks
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          FORCE: "1"
        run: bash be/scripts/check-secrets.sh
