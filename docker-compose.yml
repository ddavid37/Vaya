services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vaya
      POSTGRES_PASSWORD: vaya
      POSTGRES_DB: vaya
    ports:
      - "5432:5432"
    volumes:
      - vaya_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaya -d vaya"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  vaya_pg:
